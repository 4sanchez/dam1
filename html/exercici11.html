<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Validant sense JS</title>
        <meta name="description" content="Exercici 11: validació nativa d'HTML5">
        <meta name="author" content="Adrià Sánchez">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="exercici">
        <h1>Validant sense JS</h1>
        <p>Aquest formulari es valida només amb atributs d'HTML5, sense JavaScript.</p>

        <form action="#" method="post">
            <p>
                <label for="nom">Nom (obligatori)</label>
                <input type="text" id="nom" name="nom" required maxlength="40" placeholder="El teu nom">
            </p>
            <p>
                <label for="correu">Correu electrònic</label>
                <input type="email" id="correu" name="correu" required placeholder="nom@exemple.cat">
            </p>
            <p>
                <label for="contrasenya">Contrasenya (mínim 8 caràcters)</label>
                <input type="password" id="contrasenya" name="contrasenya" required minlength="8">
            </p>
            <p>
                <label for="telefon">Telèfon (9 dígits)</label>
                <input type="tel" id="telefon" name="telefon" required pattern="[0-9]{9}" maxlength="9" placeholder="600123456" title="Escriu 9 dígits numèrics">
            </p>
            <p>
                <label for="edat">Edat (entre 16 i 99)</label>
                <input type="number" id="edat" name="edat" min="16" max="99" step="1">
            </p>
            <p>
                <button type="submit">Enviar</button>
            </p>
        </form>
        <p class="tornar"><a href="../index.html">Tornar a l'índex</a></p>
    </body>
</html>
