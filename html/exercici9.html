<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Contacta'm</title>
        <meta name="description" content="Exercici 9: formulari de contacte">
        <meta name="author" content="Adrià Sánchez">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="exercici">
        <h1>Contacta'm</h1>
        <p>Tens alguna pregunta o proposta? Omple el formulari i et respondré tan aviat com pugui.</p>

        <form action="#" method="post">
            <p>
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom">
            </p>
            <p>
                <label for="correu">Correu electrònic</label>
                <input type="email" id="correu" name="correu" placeholder="Escriu el teu correu electrònic">
            </p>
            <p>
                <label for="missatge">Missatge</label>
                <textarea id="missatge" name="missatge" rows="5" placeholder="Escriu el teu missatge"></textarea>
            </p>
            <p>
                <button type="submit">Enviar</button>
            </p>
        </form>
        <p class="tornar"><a href="../index.html">Tornar a l'índex</a></p>
    </body>
</html>
